<section class="pantalla">
  <div class="panel">
    <div class="marca">
      <i class="bi bi-pc-display"></i>
      <h1>UPN Inventario TI-Gr06</h1>
      <p>Sistema web de inventario y préstamo de equipo tecnológico</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="ingresar()" novalidate>
      @if (error()) {
        <div class="alert alert-danger py-2" role="alert">
          <i class="bi bi-exclamation-triangle"></i> {{ error() }}
        </div>
      }

      <div class="mb-3">
        <label class="form-label" for="username">Usuario</label>
        <input
          id="username"
          class="form-control"
          formControlName="username"
          autocomplete="username"
          [class.is-invalid]="form.controls.username.touched && form.controls.username.invalid"
        />
        <div class="invalid-feedback">Ingrese su usuario</div>
      </div>

      <div class="mb-4">
        <label class="form-label" for="password">Contraseña</label>
        <div class="input-group has-validation">
          <input
            id="password"
            class="form-control"
            formControlName="password"
            autocomplete="current-password"
            [type]="verPassword() ? 'text' : 'password'"
            [class.is-invalid]="form.controls.password.touched && form.controls.password.invalid"
          />
          <button class="btn btn-outline-secondary" type="button" (click)="verPassword.set(!verPassword())">
            <i class="bi" [class.bi-eye]="!verPassword()" [class.bi-eye-slash]="verPassword()"></i>
          </button>
          <div class="invalid-feedback">Ingrese su contraseña</div>
        </div>
      </div>

      <button class="btn btn-primary w-100" type="submit" [disabled]="cargando()">
        @if (cargando()) {
          <span class="spinner-border spinner-border-sm"></span> Ingresando...
        } @else {
          Ingresar
        }
      </button>

      <p class="demo">Demo: <code>admin / admin123</code> · <code>encargado / encargado123</code></p>
    </form>
  </div>
</section>
