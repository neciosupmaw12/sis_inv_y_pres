spring.application.name=upn
server.port=8080

# Base de datos (MySQL / MariaDB de XAMPP)
spring.datasource.url=jdbc:mysql://localhost:3306/upn_inventario?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# --- TEMPORAL: muestra en consola el SQL que Hibernate genera para cada JPQL (para las capturas) ---
# Para desactivarlo, cambie DEBUG por INFO y TRACE por INFO (o borre estas 3 lineas).
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
spring.jpa.properties.hibernate.format_sql=true
# --- fin TEMPORAL ---

# Swagger UI / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.persist-authorization=true

# JWT (clave en Base64, minimo 256 bits)
app.jwt.secret=dVBOLXNpc3RlbWEtdmVudGFzLWNsYXZlLXNlY3JldGEtand0LTIwMjYtc3VwZXItc2VndXJh
app.jwt.expiration-ms=86400000

# CORS: origenes permitidos (frontend Angular)
app.cors.allowed-origins=http://localhost:4200,http://10.10.10.46:4200
