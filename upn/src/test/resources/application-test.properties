# Perfil de pruebas: base de datos SEPARADA para no tocar los datos reales de upn_inventario.
# La base upn_inventario_test se crea sola y sus tablas se regeneran en cada ejecucion de las pruebas.
spring.datasource.url=jdbc:mysql://localhost:3306/upn_inventario_test?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# En las pruebas no hace falta ver cada SQL en la consola
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.orm.jdbc.bind=INFO
spring.jpa.properties.hibernate.format_sql=false
