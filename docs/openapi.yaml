openapi: 3.1.0
info:
  title: API de Inventario y Préstamo de Equipos UPN
  description: |-
    API REST del sistema de inventario y préstamo de equipo tecnológico (Grupo 06).

    **Cómo probar los endpoints protegidos:**
    1. Ejecute `POST /api/auth/login` con `{"username":"admin","password":"admin123"}`.
    2. Copie el valor de `token` de la respuesta.
    3. Pulse **Authorize**, pegue el token (sin la palabra *Bearer*) y confirme.

    **Roles y usuarios de prueba:** `admin / admin123` (ADMIN), `encargado / encargado123`
    (ENCARGADO) y `alumno / alumno123` (ALUMNO). El alumno solicita préstamos que quedan
    PENDIENTES hasta que un ADMIN los aprueba (`PUT /api/prestamos/{id}/aprobar`) o rechaza.

    Los listados paginados usan `page` (desde 0), `size` (1 a 50) y `sort` (`campo,asc|desc`).
  contact:
    name: Grupo 06 - Universidad Privada del Norte
  version: 1.2.0
servers:
- url: http://localhost:8080
  description: Generated server url
security:
- bearerAuth: []
tags:
- name: Equipos
  description: "Inventario de equipos tecnológicos (equivale a \"productos\"). Consultar:\
    \ ADMIN y ENCARGADO · Registrar, editar y eliminar: solo ADMIN · ALUMNO: solo\
    \ /disponibles y /catalogo (equipos OPERATIVOS con stock)"
- name: Solicitantes
  description: "Estudiantes, docentes y administrativos que piden equipos (equivale\
    \ a \"clientes\"). Consultar, registrar y editar: ADMIN y ENCARGADO · Eliminar:\
    \ solo ADMIN"
- name: Usuarios
  description: "Gestión de usuarios del sistema: ADMIN, ENCARGADO y ALUMNO (solo ADMIN)"
- name: Panel
  description: Indicadores globales del panel de inicio (ADMIN y ENCARGADO; el alumno
    usa /api/prestamos/mis-prestamos/resumen)
- name: Préstamos
  description: "Préstamos y devoluciones (equivale a \"ventas\"). Consultar, registrar\
    \ y devolver: ADMIN y ENCARGADO · Editar, anular, aprobar y rechazar: solo ADMIN\
    \ · ALUMNO: solicitar, ver sus préstamos y cancelar sus solicitudes pendientes"
- name: Autenticación
  description: "Inicio de sesión: devuelve el token JWT"
- name: Perfil
  description: "Datos del alumno autenticado (solo ALUMNO): ver su perfil y editar\
    \ correo y teléfono"
paths:
  /api/solicitantes/{id}:
    get:
      tags:
      - Solicitantes
      summary: Obtener un solicitante
      operationId: show
      parameters:
      - name: id
        in: path
        description: ID del solicitante
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      responses:
        "200":
          description: Solicitante encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Solicitante"
        "404":
          description: El solicitante no existe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                SOLICITANTE_NO_ENCONTRADO:
                  summary: Solicitante inexistente
                  description: SOLICITANTE_NO_ENCONTRADO
                  value:
                    timestamp: 2026-11-25T09:45:18
                    status: 404
                    error: Not Found
                    mensaje: Solicitante con id 999 no encontrado
                    ruta: /api/solicitantes/999
                    errores: null
    put:
      tags:
      - Solicitantes
      summary: Actualizar un solicitante
      operationId: update
      parameters:
      - name: id
        in: path
        description: ID del solicitante
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SolicitanteRequest"
        required: true
      responses:
        "200":
          description: Solicitante actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Solicitante"
        "400":
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                SOLICITANTE_PUT_DATOS_INVALIDOS:
                  summary: Campos inválidos
                  description: SOLICITANTE_PUT_DATOS_INVALIDOS
                  value:
                    timestamp: 2026-11-25T09:45:18
                    status: 400
                    error: Bad Request
                    mensaje: Los datos enviados no son válidos
                    ruta: /api/solicitantes/2
                    errores:
                      nombres: Los nombres deben tener entre 2 y 80 caracteres
        "404":
          description: El solicitante no existe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                SOLICITANTE_NO_ENCONTRADO:
                  summary: Solicitante inexistente
                  description: SOLICITANTE_NO_ENCONTRADO
                  value:
                    timestamp: 2026-11-25T09:45:18
                    status: 404
                    error: Not Found
                    mensaje: Solicitante con id 999 no encontrado
                    ruta: /api/solicitantes/999
                    errores: null
        "409":
          description: DNI o email duplicado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                SOLICITANTE_PUT_DNI_DUPLICADO:
                  summary: DNI duplicado
                  description: SOLICITANTE_PUT_DNI_DUPLICADO
                  value:
                    timestamp: 2026-11-25T09:45:18
                    status: 409
                    error: Conflict
                    mensaje: Ya existe otro solicitante con el DNI 70123456
                    ruta: /api/solicitantes/2
                    errores: null
                SOLICITANTE_PUT_EMAIL_DUPLICADO:
                  summary: Email duplicado
                  description: SOLICITANTE_PUT_EMAIL_DUPLICADO
                  value:
                    timestamp: 2026-11-25T09:45:18
                    status: 409
                    error: Conflict
                    mensaje: Ya existe otro solicitante con el email maria.quispe@upn.pe
                    ruta: /api/solicitantes/2
                    errores: null
    delete:
      tags:
      - Solicitantes
      summary: Eliminar un solicitante (ADMIN)
      operationId: delete
      parameters:
      - name: id
        in: path
        description: ID del solicitante
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      responses:
        "204":
          description: Solicitante eliminado
        "403":
          description: El rol no es ADMIN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                SOLICITANTE_SIN_PERMISO:
                  summary: Usuario ENCARGADO
                  description: SOLICITANTE_SIN_PERMISO
                  value:
                    timestamp: 2026-11-25T09:45:18
                    status: 403
                    error: Forbidden
                    mensaje: No tiene permisos para realizar esta operación
                    ruta: /api/solicitantes/3
        "404":
          description: El solicitante no existe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                SOLICITANTE_NO_ENCONTRADO:
                  summary: Solicitante inexistente
                  description: SOLICITANTE_NO_ENCONTRADO
                  value:
                    timestamp: 2026-11-25T09:45:18
                    status: 404
                    error: Not Found
                    mensaje: Solicitante con id 999 no encontrado
                    ruta: /api/solicitantes/999
                    errores: null
        "409":
          description: Tiene préstamos registrados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                SOLICITANTE_CON_PRESTAMOS:
                  summary: Tiene préstamos registrados
                  description: SOLICITANTE_CON_PRESTAMOS
                  value:
                    timestamp: 2026-11-25T09:45:18
                    status: 409
                    error: Conflict
                    mensaje: No se puede eliminar el solicitante porque tiene préstamos
                      registrados
                    ruta: /api/solicitantes/1
                    errores: null
  /api/prestamos/{id}:
    get:
      tags:
      - Préstamos
      summary: Obtener un préstamo con su detalle
      description: "ADMIN y ENCARGADO ven cualquiera; un ALUMNO solo los suyos (si\
        \ pide uno ajeno, 403)."
      operationId: show_1
      parameters:
      - name: id
        in: path
        description: ID del préstamo
        required: true
        schema:
          type: integer
          format: int64
        example: 2
      responses:
        "200":
          description: Préstamo encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrestamoResponse"
        "403":
          description: Un ALUMNO pidió el préstamo de otro solicitante
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                PRESTAMO_AJENO:
                  summary: Préstamo de otro alumno
                  description: PRESTAMO_AJENO
                  value:
                    timestamp: 2026-11-26T15:20:41
                    status: 403
                    error: Forbidden
                    mensaje: No tiene permisos para realizar esta operación
                    ruta: /api/prestamos/2
                    errores: null
        "404":
          description: El préstamo no existe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                PRESTAMO_NO_ENCONTRADO:
                  summary: Préstamo inexistente
                  description: PRESTAMO_NO_ENCONTRADO
                  value:
                    timestamp: 2026-11-25T09:45:18
                    status: 404
                    error: Not Found
                    mensaje: Préstamo con id 999 no encontrado
                    ruta: /api/prestamos/999
                    errores: null
    put:
      tags:
      - Préstamos
      summary: Editar un préstamo activo (ADMIN)
      description: Repone el stock de los equipos anteriores y descuenta el de los
        nuevos en la misma transacción.
      operationId: update_1
      parameters:
      - name: id
        in: path
        description: ID del préstamo
        required: true
        schema:
          type: integer
          format: int64
        example: 2
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrestamoRequest"
        required: true
      responses:
        "200":
          description: Préstamo actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrestamoResponse"
        "400":
          description: Datos inválidos o el préstamo ya fue devuelto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                PRESTAMO_PUT_DATOS_INVALIDOS:
                  summary: Campos inválidos
                  description: PRESTAMO_PUT_DATOS_INVALIDOS
                  value:
                    timestamp: 2026-11-25T09:45:18
                    status: 400
                    error: Bad Request
                    mensaje: Los datos enviados no son válidos
                    ruta: /api/prestamos/6
                    errores:
                      detalles[0].cantidad: La cantidad mínima es 1
                PRESTAMO_NO_EDITABLE:
                  summary: Préstamo ya devuelto
                  description: PRESTAMO_NO_EDITABLE
                  value:
                    timestamp: 2026-11-25T09:45:18
                    status: 400
                    error: Bad Request
                    mensaje: Solo se pueden editar préstamos activos
                    ruta: /api/prestamos/2
                    errores: null
        "403":
          description: El rol no es ADMIN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                PRESTAMO_SIN_PERMISO:
                  summary: Usuario ENCARGADO
                  description: PRESTAMO_SIN_PERMISO
                  value:
                    timestamp: 2026-11-25T09:45:18
                    status: 403
                    error: Forbidden
                    mensaje: No tiene permisos para realizar esta operación
                    ruta: /api/prestamos/6
        "404":
          description: El préstamo no existe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                PRESTAMO_NO_ENCONTRADO:
                  summary: Préstamo inexistente
                  description: PRESTAMO_NO_ENCONTRADO
                  value:
                    timestamp: 2026-11-25T09:45:18
                    status: 404
                    error: Not Found
                    mensaje: Préstamo con id 999 no encontrado
                    ruta: /api/prestamos/999
                    errores: null
        "409":
          description: Stock insuficiente (rollback)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                PRESTAMO_PUT_STOCK_INSUFICIENTE:
                  summary: Stock insuficiente (rollback)
                  description: PRESTAMO_PUT_STOCK_INSUFICIENTE
                  value:
                    timestamp: 2026-11-25T09:45:18
                    status: 409
                    error: Conflict
                    mensaje: "No hay unidades suficientes de 'Proyector multimedia\
                      \ Epson' (PRY-001). Disponibles: 5, solicitadas: 50. No se registró\
                      \ el préstamo."
                    ruta: /api/prestamos/6
                    errores:
                      equipoId: "3"
                      codigo: PRY-001
                      disponibles: "5"
                      solicitadas: "50"
    delete:
      tags:
      - Préstamos
      summary: Anular un préstamo (ADMIN)
      description: "Si seguía activo, sus equipos vuelven al inventario."
      operationId: delete_1
      parameters:
      - name: id
        in: path
        description: ID del préstamo
        required: true
        schema:
          type: integer
          format: int64
        example: 2
      responses:
        "204":
          description: Préstamo anulado
        "403":
          description: El rol no es ADMIN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                PRESTAMO_SIN_PERMISO:
                  summary: Usuario ENCARGADO
                  description: PRESTAMO_SIN_PERMISO
                  value:
                    timestamp: 2026-11-25T09:45:18
                    status: 403
                    error: Forbidden
                    mensaje: No tiene permisos para realizar esta operación
                    ruta: /api/prestamos/6
        "404":
          description: El préstamo no existe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                PRESTAMO_NO_ENCONTRADO:
                  summary: Préstamo inexistente
                  description: PRESTAMO_NO_ENCONTRADO
                  value:
                    timestamp: 2026-11-25T09:45:18
                    status: 404
                    error: Not Found
                    mensaje: Préstamo con id 999 no encontrado
                    ruta: /api/prestamos/999
                    errores: null
  /api/prestamos/{id}/rechazar:
    put:
      tags:
      - Préstamos
      summary: Rechazar una solicitud (ADMIN)
      description: "Motivo obligatorio. Pasa a RECHAZADO, guarda quién la rechazó\
        \ y cuándo; el stock no se toca."
      operationId: rechazar
      parameters:
      - name: id
        in: path
        description: ID de la solicitud
        required: true
        schema:
          type: integer
          format: int64
        example: 7
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RechazoRequest"
        required: true
      responses:
        "200":
          description: Solicitud rechazada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrestamoResponse"
        "400":
          description: Falta el motivo o la solicitud no está PENDIENTE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                RECHAZO_SIN_MOTIVO:
                  summary: Sin motivo
                  description: RECHAZO_SIN_MOTIVO
                  value:
                    timestamp: 2026-11-26T15:20:41
                    status: 400
                    error: Bad Request
                    mensaje: Los datos enviados no son válidos
                    ruta: /api/prestamos/7/rechazar
                    errores:
                      motivo: El motivo del rechazo es obligatorio
                RECHAZAR_NO_PENDIENTE:
                  summary: Ya fue atendida
                  description: RECHAZAR_NO_PENDIENTE
                  value:
                    timestamp: 2026-11-26T15:20:41
                    status: 400
                    error: Bad Request
                    mensaje: "Solo se pueden rechazar solicitudes PENDIENTES; la #7\
                      \ está RECHAZADO"
                    ruta: /api/prestamos/7/rechazar
                    errores: null
        "403":
          description: El rol no es ADMIN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                RECHAZAR_SIN_PERMISO:
                  summary: Usuario ENCARGADO o ALUMNO
                  description: RECHAZAR_SIN_PERMISO
                  value:
                    timestamp: 2026-11-26T15:20:41
                    status: 403
                    error: Forbidden
                    mensaje: No tiene permisos para realizar esta operación
                    ruta: /api/prestamos/7/rechazar
        "404":
          description: La solicitud no existe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                RECHAZAR_NO_ENCONTRADA:
                  summary: Solicitud inexistente
                  description: RECHAZAR_NO_ENCONTRADA
                  value:
                    timestamp: 2026-11-26T15:20:41
                    status: 404
                    error: Not Found
                    mensaje: Préstamo con id 999 no encontrado
                    ruta: /api/prestamos/999/rechazar
                    errores: null
  /api/prestamos/{id}/devolucion:
    put:
      tags:
      - Préstamos
      summary: Registrar la devolución
      description: Solo préstamos ACTIVOS (o vencidos). Repone el stock de todos los
        equipos del préstamo en una sola transacción.
      operationId: devolver
      parameters:
      - name: id
        in: path
        description: ID del préstamo
        required: true
        schema:
          type: integer
          format: int64
        example: 2
      responses:
        "200":
          description: Devolución registrada y stock repuesto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrestamoResponse"
        "400":
          description: El préstamo ya fue devuelto o no está ACTIVO
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                PRESTAMO_YA_DEVUELTO:
                  summary: Ya devuelto
                  description: PRESTAMO_YA_DEVUELTO
                  value:
                    timestamp: 2026-11-25T09:45:18
                    status: 400
                    error: Bad Request
                    mensaje: "El préstamo #2 ya fue devuelto"
                    ruta: /api/prestamos/2/devolucion
                    errores: null
                DEVOLUCION_NO_ACTIVO:
                  summary: Solicitud pendiente
                  description: DEVOLUCION_NO_ACTIVO
                  value:
                    timestamp: 2026-11-26T15:20:41
                    status: 400
                    error: Bad Request
                    mensaje: "Solo se pueden devolver préstamos activos; el #7 está\
                      \ PENDIENTE"
                    ruta: /api/prestamos/7/devolucion
                    errores: null
        "404":
          description: El préstamo no existe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                DEVOLUCION_PRESTAMO_NO_ENCONTRADO:
                  summary: Préstamo inexistente
                  description: DEVOLUCION_PRESTAMO_NO_ENCONTRADO
                  value:
                    timestamp: 2026-11-25T09:45:18
                    status: 404
                    error: Not Found
                    mensaje: Préstamo con id 999 no encontrado
                    ruta: /api/prestamos/999/devolucion
                    errores: null
        "409":
          description: Modificación simultánea del mismo equipo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                DEVOLUCION_MODIFICACION_SIMULTANEA:
                  summary: Bloqueo optimista
                  description: DEVOLUCION_MODIFICACION_SIMULTANEA
                  value:
                    timestamp: 2026-11-25T09:45:18
                    status: 409
                    error: Conflict
                    mensaje: Otro usuario modificó el mismo equipo al mismo tiempo.
                      No se guardó ningún cambio; vuelva a intentarlo.
                    ruta: /api/prestamos/6/devolucion
                    errores: null
  /api/prestamos/{id}/cancelar:
    put:
      tags:
      - Préstamos
      summary: Cancelar mi solicitud (ALUMNO)
      description: Solo la propia y solo mientras siga PENDIENTE. Pasa a CANCELADO;
        el stock no se toca.
      operationId: cancelar
      parameters:
      - name: id
        in: path
        description: ID de la solicitud
        required: true
        schema:
          type: integer
          format: int64
        example: 7
      responses:
        "200":
          description: Solicitud cancelada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrestamoResponse"
        "400":
          description: La solicitud ya fue atendida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                CANCELAR_NO_PENDIENTE:
                  summary: Ya no está pendiente
                  description: CANCELAR_NO_PENDIENTE
                  value:
                    timestamp: 2026-11-26T15:20:41
                    status: 400
                    error: Bad Request
                    mensaje: "Solo se pueden cancelar solicitudes PENDIENTES; la #7\
                      \ está ACTIVO"
                    ruta: /api/prestamos/7/cancelar
                    errores: null
        "403":
          description: "La solicitud es de otro alumno, o el rol no es ALUMNO"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                CANCELAR_AJENA:
                  summary: Solicitud de otro alumno
                  description: CANCELAR_AJENA
                  value:
                    timestamp: 2026-11-26T15:20:41
                    status: 403
                    error: Forbidden
                    mensaje: No tiene permisos para realizar esta operación
                    ruta: /api/prestamos/2/cancelar
                    errores: null
        "404":
          description: La solicitud no existe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                CANCELAR_NO_ENCONTRADA:
                  summary: Solicitud inexistente
                  description: CANCELAR_NO_ENCONTRADA
                  value:
                    timestamp: 2026-11-26T15:20:41
                    status: 404
                    error: Not Found
                    mensaje: Préstamo con id 999 no encontrado
                    ruta: /api/prestamos/999/cancelar
                    errores: null
  /api/prestamos/{id}/aprobar:
    put:
      tags:
      - Préstamos
      summary: Aprobar una solicitud (ADMIN)
      description: "Transacción atómica: vuelve a validar cada equipo, descuenta el\
        \ stock y pasa la solicitud a ACTIVO. Si un equipo ya no tiene unidades suficientes\
        \ responde 409 y hace ROLLBACK de todo: no se descuenta nada y la solicitud\
        \ sigue PENDIENTE."
      operationId: aprobar
      parameters:
      - name: id
        in: path
        description: ID de la solicitud
        required: true
        schema:
          type: integer
          format: int64
        example: 7
      responses:
        "200":
          description: "Solicitud aprobada: préstamo ACTIVO y stock descontado"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrestamoResponse"
        "400":
          description: "No está PENDIENTE, la fecha de devolución ya pasó, equipo\
            \ no OPERATIVO o el alumno tiene vencidos"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                APROBAR_NO_PENDIENTE:
                  summary: Ya fue atendida
                  description: APROBAR_NO_PENDIENTE
                  value:
                    timestamp: 2026-11-26T15:20:41
                    status: 400
                    error: Bad Request
                    mensaje: "Solo se pueden aprobar solicitudes PENDIENTES; la #7\
                      \ está ACTIVO"
                    ruta: /api/prestamos/7/aprobar
                    errores: null
                APROBAR_FECHA_VENCIDA:
                  summary: Fecha de devolución pasada
                  description: APROBAR_FECHA_VENCIDA
                  value:
                    timestamp: 2026-11-26T15:20:41
                    status: 400
                    error: Bad Request
                    mensaje: La fecha de devolución prevista (25/11/2026) ya pasó;
                      rechace la solicitud
                    ruta: /api/prestamos/7/aprobar
