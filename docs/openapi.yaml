        marca:
          type: string
          example: Lenovo
        modelo:
          type: string
          example: ThinkPad E14 Gen 5
        descripcion:
          type: string
        cantidadTotal:
          type: integer
          format: int32
          description: Unidades que posee la institución
          example: 10
        cantidadDisponible:
          type: integer
          format: int32
          description: Unidades en almacén (total menos prestadas)
          example: 8
        estado:
          type: string
          enum:
          - OPERATIVO
          - EN_MANTENIMIENTO
          - DE_BAJA
          example: OPERATIVO
    PageResponseEquipoResponse:
      type: object
      description: Página de resultados
      properties:
        content:
          type: array
          description: Elementos de la página actual
          items:
            $ref: "#/components/schemas/EquipoResponse"
        page:
          type: integer
          format: int32
          description: Número de página (empieza en 0)
          example: 0
        size:
          type: integer
          format: int32
          description: Tamaño de página solicitado
          example: 10
        totalElements:
          type: integer
          format: int64
          description: Total de registros que cumplen el filtro
          example: 87
        totalPages:
          type: integer
          format: int32
          description: Total de páginas
          example: 9
        first:
          type: boolean
          description: ¿Es la primera página?
          example: true
        last:
          type: boolean
          description: ¿Es la última página?
          example: false
        sort:
          type: string
          description: Orden aplicado
          example: "nombre,asc"
  securitySchemes:
    bearerAuth:
      type: http
      description: Token JWT obtenido en POST /api/auth/login
      name: bearerAuth
      scheme: bearer
      bearerFormat: JWT
