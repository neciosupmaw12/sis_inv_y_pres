                      \ codigo, estado"
                    ruta: /api/equipos/paginado
                    errores: null
                EQUIPOS_ESTADO_INVALIDO:
                  summary: Estado inexistente
                  description: EQUIPOS_ESTADO_INVALIDO
                  value:
                    timestamp: 2026-11-25T09:45:18
                    status: 400
                    error: Bad Request
                    mensaje: El parámetro 'estado' tiene un valor inválido
                    ruta: /api/equipos/paginado
                    errores: null
        "401":
          description: Sin token o token inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                EQUIPOS_PAGINADO_SIN_TOKEN:
                  summary: Sin token
                  description: EQUIPOS_PAGINADO_SIN_TOKEN
                  value:
                    timestamp: 2026-11-25T09:45:18
                    status: 401
                    error: Unauthorized
                    mensaje: Debe iniciar sesión para acceder a este recurso
                    ruta: /api/equipos/paginado
                EQUIPOS_PAGINADO_TOKEN_INVALIDO:
                  summary: Token inválido
                  description: EQUIPOS_PAGINADO_TOKEN_INVALIDO
                  value:
                    timestamp: 2026-11-25T09:45:18
                    status: 401
                    error: Unauthorized
                    mensaje: Token inválido
                    ruta: /api/equipos/paginado
  /api/equipos/disponibles:
    get:
      tags:
      - Equipos
      summary: "Equipos disponibles para préstamo (ADMIN, ENCARGADO y ALUMNO)"
      description: "Consulta JPQL: equipos en estado OPERATIVO con cantidadDisponible\
        \ > 0. La usa el formulario \"Solicitar préstamo\" del alumno."
      operationId: disponibles
      responses:
        "200":
          description: Equipos prestables
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EquipoResponse"
  /api/equipos/catalogo:
    get:
      tags:
      - Equipos
      summary: "Catálogo de equipos disponibles, paginado (ADMIN, ENCARGADO y ALUMNO)"
      description: "Solo equipos OPERATIVOS con stock > 0, con búsqueda por nombre,\
        \ código o marca y filtro de categoría. Mismos campos de orden que /paginado."
      operationId: catalogo
      parameters:
      - name: page
        in: query
        description: "Número de página, empieza en 0"
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
        example: 0
      - name: size
        in: query
        description: Registros por página (máximo 50)
        required: false
        schema:
          type: integer
          format: int32
          default: 12
          maximum: 50
          minimum: 1
        example: 12
      - name: sort
        in: query
        description: "Orden: campo,asc|desc"
        required: false
        schema:
          type: string
          default: "nombre,asc"
        example: "nombre,asc"
      - name: busqueda
        in: query
        description: "Texto a buscar en nombre, código o marca"
        required: false
        schema:
          type: string
        example: laptop
      - name: categoria
        in: query
        description: Filtro por categoría exacta
        required: false
        schema:
          type: string
        example: Laptops
      responses:
        "200":
          description: Página del catálogo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageResponseEquipoResponse"
        "400":
          description: "page < 0, size fuera de 1..50 o campo de orden no permitido"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                CATALOGO_SIZE_INVALIDO:
                  summary: size mayor a 50
                  description: CATALOGO_SIZE_INVALIDO
                  value:
                    timestamp: 2026-11-26T15:20:41
                    status: 400
                    error: Bad Request
                    mensaje: Parámetros no válidos
                    ruta: /api/equipos/catalogo
                    errores:
                      size: size no puede ser mayor a 50
  /api/usuarios/{id}:
    delete:
      tags:
      - Usuarios
      summary: Desactivar un usuario
      description: Borrado lógico; no puede desactivarse a sí mismo.
      operationId: delete_3
      parameters:
      - name: id
        in: path
        description: ID del usuario
        required: true
        schema:
          type: integer
          format: int64
        example: 2
      responses:
        "204":
          description: Usuario desactivado
        "404":
          description: El usuario no existe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                USUARIO_NO_ENCONTRADO:
                  summary: Usuario inexistente
                  description: USUARIO_NO_ENCONTRADO
                  value:
                    timestamp: 2026-11-25T09:45:18
                    status: 404
                    error: Not Found
                    mensaje: Usuario con id 999 no encontrado
                    ruta: /api/usuarios/999
                    errores: null
components:
  schemas:
    SolicitanteRequest:
      type: object
      description: Datos para registrar o actualizar un solicitante
      properties:
        dni:
          type: string
          example: "72345678"
          minLength: 1
          pattern: "\\d{8}"
        nombres:
          type: string
          example: Ana
          maxLength: 80
          minLength: 2
        apellidos:
          type: string
          example: Torres Díaz
          maxLength: 80
          minLength: 2
        tipo:
          type: string
          enum:
          - ESTUDIANTE
          - DOCENTE
          - ADMINISTRATIVO
          example: ESTUDIANTE
        area:
          type: string
          example: Ingeniería Industrial
          maxLength: 100
          minLength: 0
        email:
          type: string
          format: email
          example: ana.torres@upn.pe
          maxLength: 100
          minLength: 0
        telefono:
          type: string
          example: "956789123"
          pattern: "^$|9\\d{8}"
      required:
      - apellidos
      - dni
      - nombres
      - tipo
    ErrorResponse:
      type: object
      description: Cuerpo uniforme de error que devuelve GlobalExceptionHandler
      properties:
        timestamp:
          type: string
          format: date-time
          example: 2026-11-24T10:15:02
        status:
          type: integer
          format: int32
          example: 409
        error:
          type: string
          example: Conflict
        mensaje:
          type: string
          example: "No hay unidades suficientes de 'Proyector multimedia Epson' (PRY-001).\
            \ Disponibles: 1, solicitadas: 3. No se registró el préstamo."
        ruta:
          type: string
          example: /api/prestamos
        errores:
          type: object
          additionalProperties:
            type: string
          description: Errores por campo (400) o detalle del conflicto (409)
    Solicitante:
      type: object
      properties:
        id:
          type: integer
          format: int64
        dni:
          type: string
        nombres:
          type: string
        apellidos:
          type: string
        tipo:
          type: string
          enum:
          - ESTUDIANTE
          - DOCENTE
          - ADMINISTRATIVO
        area:
          type: string
        email:
          type: string
        telefono:
          type: string
    DetallePrestamoRequest:
      type: object
      description: Equipo y cantidad dentro de un préstamo
      properties:
        equipoId:
          type: integer
          format: int64
          example: 1
        cantidad:
          type: integer
          format: int32
          example: 2
          maximum: 100
          minimum: 1
      required:
      - cantidad
      - equipoId
    PrestamoRequest:
      type: object
      description: Datos para registrar o editar un préstamo con uno o varios equipos
      properties:
        solicitanteId:
          type: integer
          format: int64
          example: 1
        fechaDevolucionPrevista:
          type: string
          format: date
          description: Hoy o una fecha posterior
          example: 2026-12-01
        observaciones:
          type: string
          example: "Clase de Redes, laboratorio 305"
          maxLength: 255
          minLength: 0
        detalles:
          type: array
          description: Equipos y cantidades (al menos uno)
          items:
            $ref: "#/components/schemas/DetallePrestamoRequest"
          minItems: 1
      required:
      - detalles
      - fechaDevolucionPrevista
      - solicitanteId
    DetallePrestamoResponse:
      type: object
      description: Equipo y cantidad del préstamo; 'disponibles' es el stock actual
        del equipo
      properties:
        equipoId:
          type: integer
          format: int64
        codigo:
          type: string
        equipo:
          type: string
        cantidad:
          type: integer
          format: int32
        disponibles:
          type: integer
          format: int32
          example: 4
        estadoEquipo:
          type: string
          example: OPERATIVO
    PrestamoResponse:
      type: object
      description: Préstamo (o solicitud de un alumno) con su detalle de equipos
      properties:
        id:
          type: integer
          format: int64
        fechaPrestamo:
          type: string
          format: date-time
        fechaDevolucionPrevista:
          type: string
          format: date
        fechaDevolucionReal:
          type: string
          format: date-time
        estado:
          type: string
          description: "PENDIENTE, ACTIVO, VENCIDO, DEVUELTO, RECHAZADO o CANCELADO"
          example: ACTIVO
        solicitanteId:
          type: integer
          format: int64
        solicitante:
          type: string
        tipoSolicitante:
          type: string
        registradoPor:
          type: string
        totalEquipos:
          type: integer
          format: int32
        observaciones:
          type: string
          description: Observaciones del préstamo directo o motivo de la solicitud
            del alumno
        fechaSolicitud:
          type: string
          format: date-time
          description: "Solo solicitudes de alumnos: cuándo se enviaron"
        aprobadoPor:
          type: string
          description: ADMIN que aprobó o rechazó la solicitud
          example: Administrador
        fechaAprobacion:
          type: string
          format: date-time
          description: Cuándo se aprobó o rechazó
        motivoRechazo:
          type: string
          description: Motivo del rechazo
          example: No hay proyectores para esa fecha
        detalles:
          type: array
          items:
            $ref: "#/components/schemas/DetallePrestamoResponse"
    RechazoRequest:
      type: object
      description: Motivo del rechazo de una solicitud (obligatorio)
      properties:
        motivo:
          type: string
          example: No hay proyectores disponibles para esa fecha
          maxLength: 255
          minLength: 5
      required:
      - motivo
    PerfilRequest:
      type: object
      description: Datos de contacto que el alumno puede editar
      properties:
        email:
          type: string
          format: email
          example: alumno.prueba@upn.pe
          maxLength: 100
          minLength: 0
        telefono:
          type: string
          example: "951234567"
          pattern: "^$|9\\d{8}"
      required:
      - email
    PerfilResponse:
      type: object
